[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stride"
version = "0.1.0"
description = "Hybrid AI student assistant: email, schedules, weather and deadlines in Discord."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["discord.py>=2.3", "python-dotenv>=1.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
